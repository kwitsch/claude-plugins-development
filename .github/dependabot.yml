version: 2
updates:
  # pnpm workspace: root lockfile covers every plugin's package.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TS 7 yet; lift once it does
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
