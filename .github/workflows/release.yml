name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["development/**"]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.tag.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag changed plugins
        id: tag
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # shortcut: BEFORE is all zeros (first push) or missing (force push); fall back to the parent commit, or the empty tree, so only the last commit of a force push is diffed
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            || BEFORE=$(git rev-parse -q --verify "$GITHUB_SHA^" || git hash-object -t tree /dev/null)
          tags=""
          for p in $(git diff --name-only "$BEFORE" "$GITHUB_SHA" | cut -d/ -f1 | sort -u); do
            bash .github/scripts/is-plugin.sh "$p" || continue
            # ships only when build inputs and version both changed; checked here too, since an admin merge can bypass the PR check
            s=$(bash .github/scripts/ships.sh "$p" "$BEFORE" "$GITHUB_SHA")
            case $s in
              none) echo "::notice::$p: no build input and no version changed, no release"; continue ;;
              content) echo "::notice::$p: build inputs changed without a version bump, no release (ships with the next bump)"; continue ;;
              version) echo "::notice::$p: version changed without a build input change, no release"; continue ;;
            esac
            t="$p-$(jq -r .version "$p/package.json")"
            if git ls-remote --exit-code --tags origin "refs/tags/$t" > /dev/null; then
              echo "::notice::$t already exists, not re-tagging"
            else
              git tag "$t" "$GITHUB_SHA"
              git push origin "refs/tags/$t"
            fi
            tags="$tags $t"
          done
          echo "tags=$(jq -cn '$ARGS.positional' --args $tags)" >> "$GITHUB_OUTPUT"
          echo "tags:${tags:- none}"

  sync:
    needs: tag
    if: needs.tag.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tag.outputs.tags) }}
    uses: ./.github/workflows/sync.yml
    with:
      tag: ${{ matrix.tag }}
    secrets: inherit
