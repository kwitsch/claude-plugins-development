name: Publish shared

# Publishes @kwitsch/claude-code-plugin-shared (development/shared) to GitHub Packages when its version is not there yet.
on:
  push:
    branches: [main]
    paths:
      - "development/shared/**"
  workflow_dispatch:

permissions:
  contents: read

# the check-then-publish below is not atomic
concurrency:
  group: publish-shared
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch from another branch must not publish unreviewed code
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PKG: "@kwitsch/claude-code-plugin-shared"
      REGISTRY: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@v7

      # never overwrite: a version already in the registry ends the run with a notice (re-runs are idempotent)
      - name: Check version and registry
        id: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(jq -r .version development/shared/package.json)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$PKG: version '$v' must be X.Y.Z"; exit 1
          fi
          code=$(curl -sS -o "$RUNNER_TEMP/meta.json" -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" "$REGISTRY/${PKG/\//%2f}")
          case $code in
            200)
              if jq -e --arg v "$v" '.versions | has($v)' "$RUNNER_TEMP/meta.json" > /dev/null; then
                echo "::notice::$PKG@$v already published"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            404) ;; # package does not exist yet
            *) echo "::error::$PKG: registry check answered HTTP $code"; exit 1 ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.published.outputs.skip != 'true'
      # no setup-node registry option: the only registry credential is the user-level pnpm token of the publish step
      - uses: actions/setup-node@v7
        if: steps.published.outputs.skip != 'true'
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        if: steps.published.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.published.outputs.skip != 'true'
        run: pnpm --filter "$PKG" build

      # after the build: dist.test.ts skips itself without a built dist
      - name: Test
        if: steps.published.outputs.skip != 'true'
        run: pnpm --filter "$PKG" test

      # pnpm 11 ignores credentials in a project .npmrc, so the token goes to the runner's user-level config
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
          pnpm --filter "$PKG" publish --no-git-checks
