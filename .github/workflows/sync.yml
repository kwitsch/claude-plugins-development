name: Sync

on:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          p=""
          for d in */; do
            d=${d%/}
            [ -f "$d/plugin.json" ] || continue
            case "$TAG" in "$d"-*) [ ${#d} -gt ${#p} ] && p=$d ;; esac
          done
          if [ -z "$p" ]; then
            echo "::notice::tag $TAG matches no plugin, skipping"
            echo "plugin=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(jq -r .version "$p/plugin.json")
          if [ "$TAG" != "$p-$v" ]; then
            echo "::error::tag $TAG does not match $p version $v (expected $p-$v)"
            exit 1
          fi
          echo "plugin=$p" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        if: steps.resolve.outputs.plugin != ''
        env:
          TAG: ${{ github.ref_name }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: pnpm/action-setup@v4
        if: steps.resolve.outputs.plugin != ''
      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.plugin != ''
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.resolve.outputs.plugin != ''
        run: pnpm install --frozen-lockfile

      - name: Build, test, and check committed build is current
        if: steps.resolve.outputs.plugin != ''
        env:
          P: ${{ steps.resolve.outputs.plugin }}
        run: |
          pnpm --filter "$P" build
          pnpm --filter "$P" test
          git diff --exit-code -- "$P/plugin" || {
            echo "::error::$P/plugin is stale; run pnpm --filter $P build and commit"
            exit 1
          }
          test -z "$(git status --porcelain -- "$P/plugin")" || {
            echo "::error::$P/plugin has untracked build output"
            exit 1
          }

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.plugin != ''
        with:
          repository: kwitsch/claude-plugins
          token: ${{ secrets.RELEASE_TOKEN }}
          path: target

      # Pushes straight to main. RELEASE_TOKEN is a fine-grained PAT (Contents:
      # read/write on kwitsch/claude-plugins) acting as the repo admin; the main
      # branch protection there does not apply to administrators.
      - name: Mirror, commit and push to main
        if: steps.resolve.outputs.plugin != ''
        working-directory: target
        env:
          P: ${{ steps.resolve.outputs.plugin }}
          V: ${{ steps.resolve.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "plugins/$P"
          rsync -a --delete "../$P/plugin/" "plugins/$P/"
          git add -A "plugins/$P"
          if git diff --cached --quiet; then
            echo "::notice::plugins/$P already up to date"
            exit 0
          fi
          jq -e --arg n "$P" 'any(.plugins[]; .name == $n)' .claude-plugin/marketplace.json > /dev/null \
            || echo "::warning::$P has no entry in marketplace.json; add it manually"
          git config user.name "Kwitsch"
          git config user.email "kwitsch@gmail.com"
          git commit -m "Sync $P $V" -m "Synced from kwitsch/claude-plugins-development@$GITHUB_SHA (tag $TAG)."
          git push origin HEAD:main
